<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GWME Admin — Secure Login</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C9A84C;--gold2:#E8C96A;--navy:#0a1628;--error:#ef4444;--success:#22c55e;--font:'Poppins',sans-serif}
    body{font-family:var(--font);background:#0D0D0D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,0.06) 0%,transparent 50%)}
    .login-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:48px;width:100%;max-width:420px;backdrop-filter:blur(20px);box-shadow:0 32px 80px rgba(0,0,0,0.5)}
    .brand{text-align:center;margin-bottom:36px}
    .brand-logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#0D0D0D}
    .brand h1{font-size:1.5rem;color:#fff;margin-bottom:6px;font-weight:700}
    .brand p{font-size:13px;color:rgba(255,255,255,0.4)}
    .security-badge{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:8px;padding:8px 14px;margin-bottom:28px;font-size:12px;color:#86efac;font-weight:500}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:12px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px}
    .input-wrap{position:relative}
    input[type="text"],input[type="password"]{width:100%;padding:12px 44px 12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;font-size:14px;color:#fff;outline:none;font-family:var(--font);transition:border-color 0.2s}
    input:focus{border-color:var(--gold);background:rgba(255,255,255,0.07)}
    input::placeholder{color:rgba(255,255,255,0.25)}
    .input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:16px;cursor:pointer;user-select:none}
    .pin-label{font-size:12px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:10px}
    .pin-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
    .pin-cell{width:48px;height:52px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;transition:border-color 0.2s;cursor:text}
    .pin-cell.filled{border-color:var(--gold)}
    #pinInput{position:absolute;opacity:0;width:0;height:0}
    .login-btn{width:100%;padding:14px;background:var(--gold);color:#0D0D0D;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:opacity 0.2s,transform 0.1s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .login-btn:hover:not(:disabled){opacity:0.9}
    .login-btn:active:not(:disabled){transform:scale(0.99)}
    .login-btn:disabled{opacity:0.5;cursor:not-allowed}
    .spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#0D0D0D;border-radius:50%;animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#fca5a5;display:none}
    .error-msg.visible{display:block}
    .attempts-warn{font-size:12px;text-align:center;color:rgba(255,255,255,0.3);margin-top:16px}
    .attempts-warn span{color:#fca5a5;font-weight:600}
    .lockout-screen{display:none;text-align:center;padding:20px 0}
    .lockout-screen.show{display:block}
    .countdown{font-size:2.5rem;font-weight:800;color:var(--gold);margin:16px 0;letter-spacing:-2px}
    .back-link{display:block;text-align:center;margin-top:20px;font-size:13px}
    .back-link a{color:rgba(255,255,255,0.3);text-decoration:none}
    .back-link a:hover{color:var(--gold)}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
    .shake{animation:shake 0.4s}
  </style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="brand">
    <a href="index.html" class="nav-logo">
      <!-- <div class="nav-logo-mark">GW</div>
      <div><div class="nav-logo-text">GWME Insights</div><div class="nav-logo-sub">Govt. Work Made Easy</div></div> -->
      <img src="./images/logo.png" alt="" style="width: 150px;
      height: 44px;
      object-fit: contain;">
    </a>
    <h1>Admin Access</h1>
    <p>Govt. Work Made Easy · Restricted Zone</p>
  </div>
  <div class="security-badge">🔒 Secured · Server-Side Authentication</div>

  <!-- LOCKOUT -->
  <div class="lockout-screen" id="lockoutScreen">
    <div style="font-size:3rem;margin-bottom:16px">🔐</div>
    <h3 style="color:#fff;font-size:1.2rem;margin-bottom:8px">Account Locked</h3>
    <p style="color:rgba(255,255,255,0.5);font-size:13px">Too many failed attempts. Try again in:</p>
    <div class="countdown" id="countdown">15:00</div>
    <p style="color:rgba(255,255,255,0.4);font-size:12px">Close and reopen to try again after timer expires.</p>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <div class="error-msg" id="errorMsg">❌ Incorrect credentials.</div>
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="Enter username" autocomplete="off" spellcheck="false" />
        <span class="input-icon">👤</span>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter password" autocomplete="off" />
        <span class="input-icon" onclick="togglePw()" id="pwToggle">👁</span>
      </div>
    </div>
    <div class="pin-label">Security PIN (4 digits)</div>
    <div class="pin-row" id="pinRow" onclick="document.getElementById('pinInput').focus()">
      <div class="pin-cell" id="pc0">·</div>
      <div class="pin-cell" id="pc1">·</div>
      <div class="pin-cell" id="pc2">·</div>
      <div class="pin-cell" id="pc3">·</div>
    </div>
    <input type="text" id="pinInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" oninput="updatePin()" />
    <button class="login-btn" id="loginBtn" onclick="attemptLogin()">Sign In Securely →</button>
    <div class="attempts-warn" id="attemptsWarn"></div>
  </div>

  <div class="back-link"><a href="index.html">← Back to Blog</a></div>
</div>

<script>
  // ── All credentials validated server-side in api/auth.php ──
  // Nothing sensitive stored in this file.

  const API_BASE = './api';
  let pinValue = '';
  let isLoading = false;

  // Check if already logged in
  (function() {
    const token = sessionStorage.getItem('gwme_token');
    if (token) window.location.href = 'admin.html';
  })();

  // ── PIN display ──
  function updatePin() {
    const raw = document.getElementById('pinInput').value.replace(/\D/g,'');
    pinValue = raw.slice(0, 4);
    document.getElementById('pinInput').value = pinValue;
    for (let i = 0; i < 4; i++) {
      const cell = document.getElementById(`pc${i}`);
      cell.textContent = pinValue[i] ? '●' : '·';
      cell.classList.toggle('filled', !!pinValue[i]);
    }
  }

  function togglePw() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('pwToggle').textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  // ── Login — calls PHP API ──────────────────────────────────
  async function attemptLogin() {
    if (isLoading) return;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const pin      = pinValue;

    if (!username || !password || pin.length < 4) {
      showError('Please fill in all fields including the 4-digit PIN.');
      return;
    }

    setLoading(true);

    try {
      const res = await fetch(`${API_BASE}/auth.php?action=login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, pin }),
      });

      const data = await res.json();

      if (res.status === 429 && data.locked) {
        // Server-side lockout
        showLockout(data.lockout_minutes * 60);
        return;
      }

      if (!res.ok || !data.success) {
        showError(data.message || 'Incorrect credentials.');
        if (data.attempts_remaining !== undefined) {
          document.getElementById('attemptsWarn').innerHTML =
            `<span>${data.attempts_remaining}</span> attempt${data.attempts_remaining !== 1 ? 's' : ''} remaining before lockout`;
        }
        // Clear sensitive fields
        document.getElementById('password').value = '';
        document.getElementById('pinInput').value = '';
        pinValue = '';
        updatePin();
        document.getElementById('loginCard').classList.add('shake');
        setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 500);
        setLoading(false);
        return;
      }

      // ── Success ──
      sessionStorage.setItem('gwme_token', data.token);
      sessionStorage.setItem('gwme_user',  data.user);

      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '✅ Authenticated…';
      setTimeout(() => { window.location.href = 'admin.html'; }, 800);

    } catch (err) {
      showError('Cannot reach server. Please check your connection.');
      setLoading(false);
    }
  }

  function setLoading(on) {
    isLoading = on;
    const btn = document.getElementById('loginBtn');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>Authenticating…'
      : 'Sign In Securely →';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = '❌ ' + msg;
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 6000);
  }

  // ── Server-controlled lockout countdown ──
  function showLockout(seconds) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('lockoutScreen').classList.add('show');
    let left = seconds;
    const tick = () => {
      const m = String(Math.floor(left / 60)).padStart(2, '0');
      const s = String(left % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `${m}:${s}`;
      if (left <= 0) {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('lockoutScreen').classList.remove('show');
      } else {
        left--;
        setTimeout(tick, 1000);
      }
    };
    tick();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
</script>
</body>
</html>
